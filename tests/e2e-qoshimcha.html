<!doctype html><meta charset="utf-8"><body><pre id="out">running</pre>
<iframe id="f" src="../index.html" style="width:1366px;height:900px"></iframe>
<script>
const log=[];const ok=(c,m)=>log.push((c?'PASS ':'FAIL ')+m);
const f=document.getElementById('f'); const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reload=()=>new Promise(r=>{f.onload=r;f.contentWindow.location.reload();});
f.onload=async()=>{ try {
 f.onload=null; localStorage.clear(); await reload();
 let D=f.contentDocument, W=f.contentWindow; const errs=[]; W.addEventListener('error',e=>errs.push(e.message));
 const n=s=>+D.getElementById('count-'+s).textContent; const $=id=>D.getElementById(id);
 const drag=(task,col)=>{ const dt=new DataTransfer();
   task.dispatchEvent(new DragEvent('dragstart',{bubbles:true,dataTransfer:dt}));
   const over=new DragEvent('dragover',{bubbles:true,cancelable:true,dataTransfer:dt}); col.dispatchEvent(over);
   const st={ok:col.classList.contains('drop-ok'),no:col.classList.contains('drop-no'),prevented:over.defaultPrevented};
   col.dispatchEvent(new DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:dt}));
   task.dispatchEvent(new DragEvent('dragend',{bubbles:true,dataTransfer:dt})); return st; };
 const t1=$('list-new').querySelector('.task'); const b=[n('new'),n('doing')];
 let st=drag(t1,$('col-doing'));
 ok(st.ok&&st.prevented&&n('new')===b[0]-1&&n('doing')===b[1]+1,'sudrab: Yangi→Bajarilmoqda ('+b[0]+'→'+n('new')+', '+b[1]+'→'+n('doing')+')');
 const t2=$('list-new').querySelector('.task'); const before=n('done');
 st=drag(t2,$('col-done'));
 ok(st.no&&!st.prevented&&n('done')===before,'sudrab: Yangi→Tugagan rad, “bu ustunga mumkin emas” ko‘rindi');
 ok(D.querySelectorAll('.drop-ok,.drop-no,.is-dragging').length===0,'sudrashdan keyin belgilar tozalandi');
 const hist=[...D.querySelectorAll('#history-list .history__item')].map(li=>li.textContent);
 ok(hist.length>=1&&hist.length<=10&&/Yangi → Bajarilmoqda/.test(hist[0]),'tarix (eng yangisi tepada): '+hist[0]);
 $('report-open').click();
 ok(!$('report').hidden&&$('report-text').value.includes('Jami: '+W.TaxtaApp.getState().tasks.length+' ')&&D.activeElement===$('report-pdf'),'hisobot oynasi ochildi, fokus “PDF saqlash”da');
 ok(/Muddati o‘tgan \(1\)/.test($('report-text').value),'hisobotda muddati o‘tganlar bor');
 $('report-copy').click(); await wait(200); ok($('report-msg').textContent.length>0,'nusxalash xabari: '+$('report-msg').textContent);
 $('report').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 ok($('report').hidden&&D.activeElement===$('report-open'),'Esc: oyna yopildi, fokus tugmaga qaytdi');
 // mobil tablar
 f.style.width='390px'; await wait(200);
 ok(W.getComputedStyle($('col-doing')).display==='none'&&W.getComputedStyle($('col-new')).display!=='none','390px: faqat “Yangi” tabi ko‘rinadi');
 $('tab-doing').click(); await wait(50);
 ok(W.getComputedStyle($('col-doing')).display!=='none'&&W.getComputedStyle($('col-new')).display==='none'&&$('tab-doing').getAttribute('aria-selected')==='true','tab “Bajarilmoqda” ochildi');
 ok($('tc-doing').textContent===String(n('doing')),'tabdagi son: '+$('tc-doing').textContent);
 const doingBtn=$('list-doing').querySelector('.move--fwd'); doingBtn.click();
 ok(D.activeElement===$('tab-doing'),'ko‘chirilgan vazifa boshqa tabga o‘tdi — fokus tabda qoldi');
 $('tab-doing').dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
 ok($('tab-done').getAttribute('aria-selected')==='true'&&D.activeElement===$('tab-done'),'→ tugmasi bilan keyingi tab');
 ok(D.documentElement.scrollWidth<=390,'390px yonga surish yo‘q');
 await reload(); D=f.contentDocument; ok(D.getElementById('tab-done').getAttribute('aria-selected')==='true','tanlangan tab eslab qolindi');
 // --- v3 dizayn ---
 f.style.width='1366px'; await wait(150); D=f.contentDocument; const $$=id=>D.getElementById(id);
 $$('filter-btn').click(); ok(!$$('filter-pop').hidden&&$$('filter-btn').getAttribute('aria-expanded')==='true','filtr paneli ochildi');
 $$('f-pr').value='yuqori'; $$('f-pr').dispatchEvent(new Event('change'));
 ok($$('filter-count').textContent==='1'&&!$$('filter-count').hidden,'faol filtrlar soni: 1');
 $$('filter-pop').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 ok($$('filter-pop').hidden&&D.activeElement===$$('filter-btn'),'Esc: filtr paneli yopildi, fokus tugmada');
 $$('f-clear').click();
 const own=D.querySelectorAll('.task').length; $$('add-open').click(); $$('title').value='O‘zimning vazifam'; $$('drawer-submit').click();
 const samples=window.frames[0].TaxtaApp.getState().tasks.filter(t=>t.sample).length;
 $$('sample-clear').click();
 const left=window.frames[0].TaxtaApp.getState().tasks;
 ok(left.length===own+1-samples&&left.some(t=>t.title==='O‘zimning vazifam')&&$$('sample-note').hidden,'faqat namuna vazifalar o‘chdi, banner yo‘qoldi');
 $$('add-open').click(); $$('title').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 ok($$('drawer').hidden&&D.activeElement===$$('add-open'),'panel Esc bilan yopildi, fokus “+ Vazifa”da');
 f.style.width='768px'; await wait(150); ok(D.documentElement.scrollWidth<=768,'768px yonga surish yo‘q');
 f.style.width='390px'; await wait(150);
 ok(f.contentWindow.getComputedStyle($$('add-open')).position==='fixed','390px: “+ Vazifa” suzuvchi tugma');
 // --- animatsiya va tezkor tugmalar ---
 f.style.width='1366px'; await wait(150); D=f.contentDocument; const g=id=>D.getElementById(id); const FW=f.contentWindow;
 D.body.dispatchEvent(new KeyboardEvent('keydown',{key:'n',bubbles:true}));
 ok(!g('drawer').hidden&&D.activeElement===g('title'),'N tugmasi: yangi vazifa paneli ochildi');
 g('title').dispatchEvent(new KeyboardEvent('keydown',{key:'n',bubbles:true}));
 ok(!g('drawer').hidden,'matn yozilayotganda N panelni qayta ochmaydi');
 g('title').value='Animatsiya sinovi'; g('drawer-submit').click();
 ok(g('drawer').hidden&&D.querySelector('.task.just-added'),'qo‘shildi: panel darhol yopildi, karta “just-added”');
 ok(D.querySelectorAll('.drawer--ghost').length<=1&&D.querySelectorAll('[id="title"]').length===1,'yopilish nusxasida takroriy id yo‘q');
 await wait(320); ok(D.querySelectorAll('.drawer--ghost,.modal--ghost').length===0,'0.3 s dan keyin nusxa o‘chirildi');
 g('report-open').click(); g('report').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 ok(g('report').hidden&&D.activeElement===g('report-open'),'hisobot: darhol yopildi, fokus tugmada');
 await wait(320); ok(D.querySelectorAll('.modal--ghost').length===0,'hisobot nusxasi o‘chirildi');
 D.body.dispatchEvent(new KeyboardEvent('keydown',{key:'/',bubbles:true}));
 ok(D.activeElement===g('f-q'),'/ tugmasi: qidiruvga o‘tdi');
 // --- kalendar ---
 const C=id=>D.getElementById(id); const FW2=f.contentWindow; const T2=FW2.Taxta; const td=T2.todayStr(); const tm=T2.addDays(td,1), ye=T2.addDays(td,-1);
 C('add-open').click(); C('due-btn').click();
 ok(!C('due-pop').hidden&&C('due-btn').getAttribute('aria-expanded')==='true'&&D.activeElement.classList.contains('cal__day'),'kalendar ochildi, fokus kunda');
 ok(C('due-pop').querySelectorAll('.cal__week span').length===7&&/^Du/.test(C('due-pop').querySelector('.cal__week').textContent),'hafta kunlari o‘zbekcha, dushanbadan');
 const yb=C('due-pop').querySelector('.cal__day[data-date="'+ye+'"]'); ok(!yb||yb.disabled,'yangi vazifada kechagi kun tanlanmaydi');
 const f0=D.activeElement.dataset.date; D.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));
 ok(D.activeElement.dataset.date===T2.addDays(f0,1),'→ keyingi kunga o‘tdi');
 const calT1=C('due-pop').querySelector('.cal__title').textContent; C('due-pop').querySelectorAll('.cal__nav .icon-btn')[1].click();
 ok(C('due-pop').querySelector('.cal__title').textContent!==calT1&&!C('due-pop').hidden,'keyingi oy (kalendar ochiq qoldi): '+C('due-pop').querySelector('.cal__title').textContent);
 [...C('due-pop').querySelectorAll('.chip')].find(c=>c.textContent==='Ertaga').click();
 ok(C('due').value===tm&&C('due-pop').hidden&&D.activeElement===C('due-btn')&&!C('due-clear').hidden,'“Ertaga”: '+C('due-btn-text').textContent);
 C('due-btn').click(); C('due-pop').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 ok(C('due-pop').hidden&&!C('drawer').hidden,'Esc faqat kalendarni yopdi, panel ochiq');
 C('due-clear').click(); ok(C('due').value===''&&/Sana tanlang/.test(C('due-btn-text').textContent),'muddat tozalandi');
 C('title').value=''; C('due').value='2020-01-01'; C('drawer-submit').click();
 ok(/oldin/.test(C('due-error').textContent)&&C('due-btn').getAttribute('aria-invalid')==='true','o‘tgan muddat: xato kalendar tugmasida');
 C('title').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 const late=FW2.TaxtaApp.getState().tasks.find(t=>t.due&&t.due<td);
 if(late){ D.querySelector('.task[data-id="'+late.id+'"] .icon-btn').click(); C('due-btn').click();
   const lb=C('due-pop').querySelector('.cal__day[data-date="'+ye+'"]'); ok(!lb||!lb.disabled,'tahrirda o‘tgan kunlar ochiq'); C('title').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true})); }
 // --- hisobot hujjati va PDF ---
 const R=id=>D.getElementById(id); const RW=f.contentWindow; let printed=0; RW.print=()=>{printed++;};
 R('report-open').click(); const rv=R('report-view');
 ok(rv.querySelectorAll('.stat').length===4&&rv.querySelectorAll('.report__section').length===3,'hisobot: 4 ta raqam kartasi, 3 ta bo‘lim');
 ok(rv.querySelector('.report__name').textContent==='Jamoa taxtasi'&&/\d+-[a-z]+ \d{4}/.test(rv.querySelector('.report__date b').textContent),'hisobot sarlavhasi va sanasi: '+rv.querySelector('.report__date b').textContent);
 const totalNow=RW.TaxtaApp.getState().tasks.length; ok(rv.querySelector('.stat__value').textContent===String(totalNow),'jami soni taxta bilan bir xil: '+totalNow);
 const oldTitle=D.title; R('report-pdf').click();
 ok(printed===1&&D.body.classList.contains('printing')&&/hisobot/.test(D.title),'PDF: chop etish chaqirildi, sarlavha: '+D.title);
 RW.dispatchEvent(new Event('afterprint')); ok(!D.body.classList.contains('printing')&&D.title===oldTitle,'chop etishdan keyin holat tiklandi');
 R('report').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 // --- tozalash tasdig'i ---
 const n0=RW.TaxtaApp.getState().tasks.length;
 R('reset').click();
 ok(!R('reset-confirm').hidden&&D.activeElement===R('reset-no')&&R('reset-desc').textContent.includes(n0+' ta'),'tozalash: o‘rtada tasdiq oynasi, fokus “Bekor qilish”da');
 R('reset-confirm').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
 ok(R('reset-confirm').hidden&&D.activeElement===R('reset')&&RW.TaxtaApp.getState().tasks.length===n0,'Esc: hech narsa o‘chmadi, fokus “Tozalash”da');
 R('reset').click(); R('reset-yes').click();
 ok(R('reset-confirm').hidden&&RW.TaxtaApp.getState().tasks.length===0&&!R('toast').hidden,'“O‘chirish”: taxta tozalandi, xabar chiqdi');
 R('toast-undo').click(); ok(RW.TaxtaApp.getState().tasks.length===n0,'tozalash bekor qilindi');
 R('reset').click(); R('reset-yes').click(); R('reset').click();
 ok(R('reset-confirm').hidden&&/allaqachon bo‘sh/.test(R('toast-text').textContent),'bo‘sh taxtada oyna chiqmaydi: '+R('toast-text').textContent);
 ok(errs.length===0,'JS xatolar: '+(errs.join('; ')||'yo‘q'));
 } catch(e){ log.push('EXC '+e.message+' | '+(e.stack||'').split('\n')[1]); }
 document.getElementById('out').textContent=log.join('\n');
};
</script>
